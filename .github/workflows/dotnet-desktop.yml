name: Build and Release Console App

on:
  push:
    tags:
      - 'v*.*.*'       # Triggers release build when pushing tags like v1.0.0
  workflow_dispatch:   # Allows manual runs from the GitHub Actions UI

permissions:
  contents: write      # Required to create GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run Tests
      run: dotnet test --configuration Release

    - name: Publish Console App
      # Builds a single, self-contained executable for 64-bit Windows
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish

    - name: Zip Artifacts
      run: |
        cd ./publish
        zip -r ../console-app-win-x64.zip .
        cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: console-app-win-x64.zip
        generate_release_notes: true
