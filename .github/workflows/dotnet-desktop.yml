name: Build and Release Console App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Console App
      shell: pwsh
      run: |
        dotnet publish ClearMark.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish

    - name: Zip Artifacts
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./ClearMark-win-x64.zip -Force

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ClearMark-win-x64.zip
        generate_release_notes: true
