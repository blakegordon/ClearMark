  <rect width="100%" height="100%" rx="8" fill="#1e1e1e"/>
  <g xml:space="preserve">
    <text x="16" y="22"><tspan class="cy">ClearMark v1.0</tspan> — Transparent System Benchmark</text>
    <text x="16" y="39" class="dm">https://github.com/blakegordon/ClearMark — All scoring formulas are visible in source code.</text>
    <text x="16" y="73">╔═ClearMark v1.0══════════════════════════════════════════════════════╗</text>
    <text x="16" y="90">║  CPU:  2x Intel(R) Xeon(R) Gold 6244 CPU @ 3.60GHz (16C/32T, X64)  ║</text>
    <text x="16" y="107">║  RAM:  766.7 GB @ 2400 MHz                                         ║</text>
    <text x="16" y="124">║  GPU:  NVIDIA GeForce RTX 4090                                     ║</text>
    <text x="16" y="141">║  Disk: WD_BLACK SN850X 4000GB                                      ║</text>
    <text x="16" y="158">║  OS:   Microsoft Windows 10.0.22000                                ║</text>
    <text x="16" y="175">╚════════════════════════════════════════════════════════════════════╝</text>
    <text x="170" y="209"><tspan class="yl bw">CPU</tspan></text>
