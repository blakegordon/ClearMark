    <text x="16" y="73">╔═ClearMark&#160;v1.0══════════════════════════════════════════════════════╗</text>
    <text x="16" y="90">║&#160;&#160;CPU:&#160;&#160;2x&#160;Intel(R)&#160;Xeon(R)&#160;Gold&#160;6244&#160;CPU&#160;@&#160;3.60GHz&#160;(16C/32T,&#160;X64)&#160;&#160;║</text>
