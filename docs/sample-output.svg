    <text x="16" y="243">│ Test             │        Result │ Score │</text>
    <text x="16" y="260">├──────────────────┼───────────────┼───────┤</text>
    <text x="16" y="277">│ Integer (1T)     │    1,971 Mops │<tspan class="or">    66</tspan> │</text>
    <text x="16" y="294">│ Integer (nT)     │   13,401 Mops │<tspan class="or">    67</tspan> │</text>
    <text x="16" y="311">│ Float (1T)       │    716 Mflops │<tspan class="rd">    24</tspan> │</text>
    <text x="16" y="328">│ Float (nT)       │ 11,205 Mflops │<tspan class="or">    51</tspan> │</text>
    <text x="16" y="345">│ Crypto (1T)      │      279 MB/s │<tspan class="rd">    14</tspan> │</text>
    <text x="16" y="362">│ Crypto (nT)      │    4,298 MB/s │<tspan class="rd">    31</tspan> │</text>
    <text x="16" y="379">│ Compression (1T) │      486 MB/s │<tspan class="rd">    19</tspan> │</text>
    <text x="16" y="396">│ Compression (nT) │    3,023 MB/s │<tspan class="rd">    17</tspan> │</text>
    <text x="16" y="413">└──────────────────┴───────────────┴───────┘</text>
