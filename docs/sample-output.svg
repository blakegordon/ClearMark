    <text x="16" y="1212">│ Test        │       Result │ Score │</text>
    <text x="16" y="1229">├─────────────┼──────────────┼───────┤</text>
    <text x="16" y="1246">│ GPU FP32    │ 6,585 Mpix/s │<tspan class="yl">    82</tspan> │</text>
    <text x="16" y="1263">│ GPU FP64    │ 3,170 Mpix/s │<tspan class="bg"> 2,113</tspan> │</text>
    <text x="16" y="1280">│ GPU Integer │ 10,698 GIOPS │<tspan class="gn">   107</tspan> │</text>
    <text x="16" y="1297">└─────────────┴──────────────┴───────┘</text>
